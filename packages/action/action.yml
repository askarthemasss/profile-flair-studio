name: "Sigil — Static SVG Backup"
description: >
  Fetches your GitHub stats using your own token and writes static SVG copies
  of all nine Sigil cards to your repository. Your profile survives even if
  sigil.dev goes down.
author: "Sigil (MIT)"

inputs:
  github-token:
    description: "GitHub token with repo write access (use secrets.GITHUB_TOKEN)"
    required: true
  username:
    description: "GitHub username to generate cards for"
    required: true
  theme:
    description: "Theme ID to use for the cards (e.g. obsidian, verdigris)"
    required: false
    default: "obsidian"
  output-dir:
    description: "Directory to write SVG files to (relative to repo root)"
    required: false
    default: ".sigil"
  cards:
    description: "Comma-separated list of card kinds to generate (default: all nine)"
    required: false
    default: "overview,streak,languages,heatmap,skyline,activity,achievements,repo,banner"

outputs:
  files-written:
    description: "Number of SVG files committed"

runs:
  using: "node20"
  main: "dist/index.js"
