name: Feature request
description: Suggest a capability, card, or workflow that would make Sigil more useful.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please focus on the problem and the user, not only on the implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where Sigil falls short today.
      placeholder: "When I want to..., I have to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or other designs you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Studio UI
        - Render API / Worker
        - Core package / card rendering
        - GitHub Action
        - Theme system
        - Docs
        - CI or deployment
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with guidance"
        - "No, just suggesting"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
