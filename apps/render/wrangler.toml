name = "sigil-render"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN — GitHub token(s) for API calls (comma-separated pool)
#
# There is no database. Snapshots are cached in the per-colo Cloudflare Cache
# API and refreshed on demand by stale-while-revalidate.
