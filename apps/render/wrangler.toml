name = "sigil-render"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cron Triggers — background refresh of cached cards.
# Every 5 minutes; keeps stale-while-revalidate warm.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN       — GitHub OAuth App token for API calls
#   SUPABASE_URL       — Supabase project URL
#   SUPABASE_ANON_KEY  — Supabase anon key
#   TOKEN_ENCRYPT_KEY  — AES-256-GCM key for user token encryption
